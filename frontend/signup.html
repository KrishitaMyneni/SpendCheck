<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendCheck - Sign Up</title>
  <link rel="stylesheet" href="mainpage.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <span>SpendCheck</span>
        </a>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join SpendCheck to start tracking your daily expenses</p>
      </div>

      <div id="alertBox" class="alert alert-error"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Jane Doe" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password (min. 6 characters)</label>
          <input type="password" id="password" required minlength="6" placeholder="Choose a secure password" autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          Sign Up
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    if (isAuthenticated()) {
      window.location.href = "index.html";
    }

    const form = document.getElementById("signupForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      alertBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await SpendCheckAPI.signup(name, email, password);
        window.location.href = "index.html";
      } catch (err) {
        alertBox.textContent = err.message || "Failed to create account.";
        alertBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
      }
    });
  </script>
</body>
</html>
