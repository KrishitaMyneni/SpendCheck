<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendCheck - Log In</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f8fc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }

    .brand {
      color: rgb(18, 16, 139);
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .auth-card {
      background: white;
      padding: 36px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(18, 16, 139, 0.08);
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
    }

    .auth-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: rgb(18, 16, 139);
      font-size: 24px;
    }

    .auth-card p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgb(18, 16, 139);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: rgb(18, 16, 139);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background-color: rgb(12, 10, 105);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      display: none;
    }

    .alert-error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }

    .footer-text a {
      color: rgb(18, 16, 139);
      text-decoration: none;
      font-weight: bold;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <a href="index.html" class="brand">SpendCheck</a>

  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to view and manage your expenses</p>

    <div id="alertBox" class="alert alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Log In</button>
    </form>

    <div class="footer-text">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    // If already logged in, redirect to index
    if (isAuthenticated()) {
      window.location.href = "index.html";
    }

    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      alertBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await SpendCheckAPI.login(email, password);
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get("redirect");
        window.location.href = redirect ? decodeURIComponent(redirect) : "index.html";
      } catch (err) {
        alertBox.textContent = err.message || "Invalid email or password.";
        alertBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
