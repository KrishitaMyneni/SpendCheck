<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendCheck - Log In</title>
  <link rel="stylesheet" href="mainpage.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <span>SpendCheck</span>
        </a>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Log in to view and manage your expenses</p>
      </div>

      <div id="alertBox" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one for free</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    // If already logged in, redirect to index
    if (isAuthenticated()) {
      window.location.href = "index.html";
    }

    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      alertBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await SpendCheckAPI.login(email, password);
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get("redirect");
        window.location.href = redirect ? decodeURIComponent(redirect) : "index.html";
      } catch (err) {
        alertBox.textContent = err.message || "Invalid email or password.";
        alertBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
