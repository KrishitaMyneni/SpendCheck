<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpendCheck - Category Grouping</title>
  <link rel="stylesheet" href="mainpage.css">
</head>
<body>

  <!-- Unified Navigation Bar -->
  <nav class="app-nav">
    <div class="nav-container">
      <a href="index.html" class="brand-link">
        <div class="brand-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <span>SpendCheck</span>
      </a>

      <!-- Mobile Menu Toggle Button -->
      <button class="nav-mobile-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Nav Items -->
      <div class="nav-menu" id="navMenu">
        <div class="nav-links">
          <a href="index.html" class="nav-link">Dashboard</a>
          <!-- Butter Yellow Location 1: Active Nav Item Underline -->
          <a href="grouping.html" class="nav-link active">Grouping</a>
          <a href="currency.html" class="nav-link">Currency</a>
        </div>

        <div class="nav-user-section">
          <span id="userGreeting" class="user-greeting-pill"></span>
          <button id="logoutBtn" class="btn-nav-logout" style="display: none;">Log out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="app-container" style="max-width: 980px;">
    <header class="page-header">
      <h1 class="page-title">Category Breakdown</h1>
      <p class="page-subtitle">Grouped spending distribution with proportional allocation bars</p>
    </header>

    <!-- Top Summary Card -->
    <div class="grouping-summary-card">
      <div>
        <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px;">
          Overall Spending
        </div>
        <!-- Butter Yellow Location 2: Highlight on main total/summary number -->
        <div id="groupingGrandTotal" class="metric-value metric-highlight-value" style="font-size: 28px;">
          ₹0
        </div>
      </div>
      <div>
        <a href="index.html" class="btn-primary" style="height: 38px; font-size: 13.5px; text-decoration: none;">
          <span>← Back to Dashboard</span>
        </a>
      </div>
    </div>

    <!-- Category Sections Container (Populated by loadGroupedExpenses) -->
    <div id="categories">
      <div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 15px;">
        Loading grouped expenses...
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    // Universal Currency Formatter: Thousands separators & no decimals when whole (e.g. ₹52,568 and ₹200)
    function formatCurrency(amount) {
      const num = parseFloat(amount);
      if (isNaN(num)) return "₹0";
      const rounded = Math.round(num * 100) / 100;
      const isWhole = (rounded % 1 === 0);
      return "₹" + rounded.toLocaleString("en-US", {
        minimumFractionDigits: isWhole ? 0 : 2,
        maximumFractionDigits: isWhole ? 0 : 2
      });
    }

    if (requireAuth()) {
      const user = getUser();
      const greetingEl = document.getElementById("userGreeting");
      const logoutBtn = document.getElementById("logoutBtn");

      if (user && greetingEl) {
        greetingEl.textContent = `Hi, ${user.name || user.email}!`;
      }
      if (logoutBtn) {
        logoutBtn.style.display = "inline-block";
        logoutBtn.addEventListener("click", () => {
          SpendCheckAPI.logout();
        });
      }

      loadGroupedExpenses();
    }

    async function loadGroupedExpenses() {
      const container = document.getElementById("categories");

      const categories = {
        Travel: [],
        Education: [],
        Food: [],
        Essentials: [],
        Other: []
      };

      try {
        const res = await SpendCheckAPI.getExpenses();
        const expenses = (res && res.data) || [];

        let grandTotal = 0;
        expenses.forEach(entry => {
          grandTotal += parseFloat(entry.amount || 0);
          const catKey = entry.categoryDisplayName || entry.category;
          for (let c in categories) {
            if (c.toLowerCase() === (catKey || "").toLowerCase()) {
              categories[c].push(entry);
              break;
            }
          }
        });

        // Update Grand Total once per data load
        const grandTotalEl = document.getElementById("groupingGrandTotal");
        if (grandTotalEl) grandTotalEl.textContent = formatCurrency(grandTotal);

        container.innerHTML = "";

        for (let cat in categories) {
          const section = document.createElement("div");
          section.className = "category-section";

          const headerDiv = document.createElement("div");
          headerDiv.className = "category-header";

          const title = document.createElement("h2");
          title.textContent = cat;
          headerDiv.appendChild(title);

          const items = categories[cat];
          const total = items.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);

          const totalSpan = document.createElement("span");
          totalSpan.className = "category-total";
          totalSpan.textContent = `Total: ${formatCurrency(total)} (${items.length} item${items.length === 1 ? '' : 's'})`;
          headerDiv.appendChild(totalSpan);

          section.appendChild(headerDiv);

          // Add proportional pure-CSS progress bar once per load
          const percent = grandTotal > 0 ? Math.min(100, Math.max(0, ((total / grandTotal) * 100))).toFixed(1) : 0;
          const track = document.createElement("div");
          track.className = "category-progress-track";
          track.title = `${percent}% of total spending`;

          const fill = document.createElement("div");
          fill.className = `category-progress-fill fill-${cat.toLowerCase()}`;
          fill.style.width = `${percent}%`;
          track.appendChild(fill);
          section.appendChild(track);

          if (items.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty-text";
            empty.textContent = "No expenses yet.";
            section.appendChild(empty);
          } else {
            items.forEach(entry => {
              const line = document.createElement("div");
              line.className = "expense-entry";

              const d = new Date(entry.expenseDate + "T00:00:00");
              const dayName = d.toLocaleDateString("en-US", { weekday: "long" });
              const dateFormatted = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

              line.innerHTML = `
                <span class="amount">${formatCurrency(entry.amount)}</span>
                <span class="date">${dayName}, ${dateFormatted}</span>
              `;
              section.appendChild(line);
            });
          }

          container.appendChild(section);
        }
      } catch (err) {
        container.innerHTML = `<p style="color: #dc2626; text-align: center; padding: 30px;">Error loading grouped expenses: ${err.message}</p>`;
      }
    }

    // Purely Visual UI: Mobile Nav Toggle
    const navToggle = document.getElementById("navToggle");
    const navMenu = document.getElementById("navMenu");
    if (navToggle && navMenu) {
      navToggle.addEventListener("click", () => {
        const isOpen = navMenu.classList.toggle("open");
        navToggle.setAttribute("aria-expanded", isOpen);
      });
      document.addEventListener("click", (e) => {
        if (!navToggle.contains(e.target) && !navMenu.contains(e.target)) {
          navMenu.classList.remove("open");
          navToggle.setAttribute("aria-expanded", "false");
        }
      });
    }
  </script>

</body>
</html>
