# ===================================================================
# SpendCheck Backend Configuration
# ===================================================================

# Application Information
spring.application.name=spendcheck-backend
server.port=${PORT:8080}

# ===================================================================
# PostgreSQL Database Configuration
# Environment variables:
#   DB_URL      - e.g. jdbc:postgresql://localhost:5432/spendcheck
#   DB_USERNAME - e.g. postgres
#   DB_PASSWORD - e.g. your_password
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendcheck}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration
# Environment variables:
#   JWT_SECRET        - 256-bit+ secret key
#   JWT_EXPIRATION_MS - Token expiration in milliseconds (default 24h)
# ===================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.spendcheck=DEBUG
logging.level.org.springframework.security=INFO
