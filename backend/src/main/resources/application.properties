# ===================================================================
# SpendCheck Backend Configuration
# ===================================================================

# Application Information
spring.application.name=spendcheck-backend
server.port=${PORT:8080}

# ===================================================================
# PostgreSQL Database Configuration (Neon PostgreSQL)
# Credentials come strictly from environment variables:
#   DB_URL
#   DB_USERNAME
#   DB_PASSWORD
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendcheck}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HikariCP Connection Pool Configuration (Neon Serverless Optimized)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration
# Environment variables:
#   JWT_SECRET
#   JWT_EXPIRATION_MS
# ===================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS Configuration
# Environment variable:
#   CORS_ORIGINS
# ===================================================================
cors.origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,https://spendcheck-website.netlify.app}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.spendcheck=INFO
logging.level.org.springframework.security=INFO
