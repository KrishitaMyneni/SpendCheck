  status = 200

[[redirects]]
  from = "/grouping"
  to = "/grouping.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

